<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="t d"><title id="t">Numbers, not adjectives</title><desc id="d">6+ years of critical infrastructure in production; 99.99% availability in air traffic control (DECEA); 10M+ requests per day through the API gateway; 1 TB+ of logs processed per month; 65% faster detection (MTTD); 25% lower monthly cloud spend.</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1d2634" stroke-opacity=".5"/></pattern></defs><style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
.rise{animation:rise .8s ease-out both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes travel{to{stroke-dashoffset:-100}}

.bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.scan{animation:scan 7s ease-in-out 2s infinite}
@keyframes scan{60%,100%{transform:translateX(980px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="149" rx="14" fill="#0a0e14" stroke="#1d2634"/><rect x="1" y="1" width="898" height="148" rx="14" fill="url(#grid)"/><text x="24" y="31" font-size="11" fill="#7e8b9c">$ kubectl get results</text><text class="serif" x="876" y="33" font-size="21" fill="#c9d3df" text-anchor="end">Numbers, not adjectives</text><linearGradient id="sg"><stop offset="0" stop-color="#93a3f5" stop-opacity="0"/><stop offset=".5" stop-color="#93a3f5" stop-opacity=".09"/><stop offset="1" stop-color="#93a3f5" stop-opacity="0"/></linearGradient><g class="rise" style="animation-delay:0.2s"><rect x="24" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="38" y="86" font-size="25" font-weight="700" fill="#93a3f5">6+</text><rect class="bar" style="animation-delay:0.55s" x="38" y="95" width="104" height="2" rx="1" fill="#93a3f5" opacity=".8"/><text x="38" y="112" font-size="10" fill="#7e8b9c">years of critical</text><text x="38" y="125" font-size="10" fill="#7e8b9c">infra in production</text></g><g class="rise" style="animation-delay:0.32s"><rect x="166" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="180" y="86" font-size="25" font-weight="700" fill="#22d3ee">99.99%</text><rect class="bar" style="animation-delay:0.67s" x="180" y="95" width="104" height="2" rx="1" fill="#22d3ee" opacity=".8"/><text x="180" y="112" font-size="10" fill="#7e8b9c">availability —</text><text x="180" y="125" font-size="10" fill="#7e8b9c">air traffic · DECEA</text></g><g class="rise" style="animation-delay:0.44s"><rect x="308" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="322" y="86" font-size="25" font-weight="700" fill="#3fb950">10M+</text><rect class="bar" style="animation-delay:0.79s" x="322" y="95" width="104" height="2" rx="1" fill="#3fb950" opacity=".8"/><text x="322" y="112" font-size="10" fill="#7e8b9c">requests/day</text><text x="322" y="125" font-size="10" fill="#7e8b9c">via API gateway</text></g><g class="rise" style="animation-delay:0.56s"><rect x="450" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="464" y="86" font-size="25" font-weight="700" fill="#e3b341">1TB+</text><rect class="bar" style="animation-delay:0.91s" x="464" y="95" width="104" height="2" rx="1" fill="#e3b341" opacity=".8"/><text x="464" y="112" font-size="10" fill="#7e8b9c">logs processed</text><text x="464" y="125" font-size="10" fill="#7e8b9c">per month</text></g><g class="rise" style="animation-delay:0.68s"><rect x="592" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="606" y="86" font-size="25" font-weight="700" fill="#93a3f5">−65%</text><rect class="bar" style="animation-delay:1.03s" x="606" y="95" width="104" height="2" rx="1" fill="#93a3f5" opacity=".8"/><text x="606" y="112" font-size="10" fill="#7e8b9c">detection time</text><text x="606" y="125" font-size="10" fill="#7e8b9c">(MTTD)</text></g><g class="rise" style="animation-delay:0.8s"><rect x="734" y="48" width="132" height="84" rx="10" fill="#0f141d" stroke="#1d2634"/><text x="748" y="86" font-size="25" font-weight="700" fill="#22d3ee">−25%</text><rect class="bar" style="animation-delay:1.15s" x="748" y="95" width="104" height="2" rx="1" fill="#22d3ee" opacity=".8"/><text x="748" y="112" font-size="10" fill="#7e8b9c">monthly cloud</text><text x="748" y="125" font-size="10" fill="#7e8b9c">spend</text></g><rect class="scan" x="-80" y="48" width="80" height="84" fill="url(#sg)"/></svg>
