<svg xmlns="http://www.w3.org/2000/svg" width="106" height="28" viewBox="0 0 106 28" role="img" aria-labelledby="t d"><title id="t">Ink&amp;Code</title><desc id="d">Ink&amp;Code</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1d2634" stroke-opacity=".5"/></pattern></defs><style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
.rise{animation:rise .8s ease-out both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes travel{to{stroke-dashoffset:-100}}

.meridian{transform-box:fill-box;transform-origin:center;animation:turn 3s ease-in-out infinite}
@keyframes turn{50%{transform:scaleX(.15)}}
.accent{stroke-dasharray:18 82;animation:travel 6s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="105" height="27" rx="6" fill="#0f141d" stroke="#1d2634"/><text x="14" y="18" font-size="10" font-weight="700" fill="#93a3f5" text-anchor="middle">&lt;/&gt;</text><path d="M28.5 6V22" stroke="#1d2634"/><text x="38" y="18.5" font-size="12" fill="#e6edf3">Ink&amp;Code</text><path class="accent" d="M6 27.5H100" stroke="#93a3f5" pathLength="100"/></svg>
