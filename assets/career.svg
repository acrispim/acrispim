<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="t d"><title id="t">De soldado a fundador</title><desc id="d">Carreira: Força Aérea Brasileira (2012, soldado); Exati Tecnologia (2017, full stack); Delivery Center (2020, SRE e DevOps); DECEA (2022, SRE e DevOps); Ink&amp;Code (desde 2023, fundador); Arlequim Technologies (desde 2024, SRE e platform). Em formação: CST Defesa Cibernética (FIAP) e forense de rede e computação (HackerSec).</desc><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1d2634" stroke-opacity=".5"/></pattern></defs><style>
text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
.rise{animation:rise .8s ease-out both}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes travel{to{stroke-dashoffset:-100}}

.line{stroke-dasharray:700;animation:draw 2.4s ease-out .3s both}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.node{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.sig{stroke-dasharray:.5 2;animation:travel 10s linear infinite}
.sonar{transform-box:fill-box;transform-origin:center;animation:sonar 2.6s ease-out 3.0s infinite both}
@keyframes sonar{0%{transform:scale(.5);opacity:0}20%{opacity:.8}100%{transform:scale(2.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="189" rx="14" fill="#0a0e14" stroke="#1d2634"/><rect x="1" y="1" width="898" height="188" rx="14" fill="url(#grid)"/><text x="24" y="31" font-size="11" fill="#7e8b9c">$ git log --oneline career/</text><text class="serif" x="876" y="33" font-size="21" fill="#c9d3df" text-anchor="end">De soldado a fundador</text><path d="M100 100H800" stroke="#1d2634" stroke-width="2"/><path class="line" d="M100 100H800" stroke="#93a3f5" stroke-width="2"/><path class="sig" d="M100 100H800" stroke="#e6edf3" stroke-opacity=".5" pathLength="100"/><circle class="node" style="animation-delay:0.3s" cx="100.0" cy="100" r="6" fill="#0a0e14" stroke="#93a3f5" stroke-width="2"/><g class="rise" style="animation-delay:0.3s"><text x="100.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2012</text><text x="100.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">Força Aérea (FAB)</text><text x="100.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">soldado</text></g><circle class="node" style="animation-delay:0.78s" cx="240.0" cy="100" r="6" fill="#0a0e14" stroke="#93a3f5" stroke-width="2"/><g class="rise" style="animation-delay:0.78s"><text x="240.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2017</text><text x="240.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">Exati Tecnologia</text><text x="240.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">full stack</text></g><circle class="node" style="animation-delay:1.26s" cx="380.0" cy="100" r="6" fill="#0a0e14" stroke="#93a3f5" stroke-width="2"/><g class="rise" style="animation-delay:1.26s"><text x="380.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2020</text><text x="380.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">Delivery Center</text><text x="380.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">SRE · DevOps</text></g><circle class="node" style="animation-delay:1.74s" cx="520.0" cy="100" r="6" fill="#0a0e14" stroke="#93a3f5" stroke-width="2"/><g class="rise" style="animation-delay:1.74s"><text x="520.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2022</text><text x="520.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">DECEA</text><text x="520.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">SRE · DevOps</text></g><circle class="node" style="animation-delay:2.22s" cx="660.0" cy="100" r="6" fill="#0a0e14" stroke="#93a3f5" stroke-width="2"/><g class="rise" style="animation-delay:2.22s"><text x="660.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2023 → hoje</text><text x="660.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">Ink&amp;Code</text><text x="660.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">fundador</text></g><circle class="sonar" cx="800.0" cy="100" r="9" fill="none" stroke="#3fb950"/><g class="rise" style="animation-delay:2.7s"><rect x="780.0" y="50" width="40" height="16" rx="8" fill="none" stroke="#3fb950"/><text x="800.0" y="61.5" font-size="9" fill="#3fb950" text-anchor="middle">HEAD</text></g><circle class="node" style="animation-delay:2.7s" cx="800.0" cy="100" r="6" fill="#0a0e14" stroke="#3fb950" stroke-width="2"/><g class="rise" style="animation-delay:2.7s"><text x="800.0" y="84" font-size="11" fill="#e3b341" text-anchor="middle">2024 → hoje</text><text x="800.0" y="127" font-size="11.5" fill="#c9d3df" text-anchor="middle">Arlequim Technologies</text><text x="800.0" y="144" font-size="10" fill="#7e8b9c" text-anchor="middle">SRE · platform</text></g><text class="rise" style="animation-delay:2.9s" x="24" y="174" font-size="10" fill="#7e8b9c"><tspan fill="#3fb950">+</tspan> em formação: CST Defesa Cibernética (FIAP) · forense de rede e computação (HackerSec)</text></svg>
